<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="180" fill="url(#bgGrad)" rx="8"/>
  <rect x="0" y="0" width="760" height="2" fill="url(#accent)" opacity="0.7"/>
  <rect x="0" y="178" width="760" height="2" fill="url(#accent)" opacity="0.4"/>

  <!-- Funnel / sluice icon -->
  <g transform="translate(90, 88)" filter="url(#glow)">
    <!-- Funnel shape -->
    <path d="M-28,-35 L28,-35 L10,0 L10,25 L-10,25 L-10,0 Z" fill="none" stroke="#fb923c" stroke-width="2" stroke-linejoin="round"/>
    <!-- Hash symbols falling in -->
    <text x="-14" y="-22" font-family="'Courier New', monospace" font-size="10" fill="#fb923c" opacity="0.5">#</text>
    <text x="2" y="-26" font-family="'Courier New', monospace" font-size="8" fill="#fb923c" opacity="0.4">#</text>
    <text x="10" y="-20" font-family="'Courier New', monospace" font-size="10" fill="#fb923c" opacity="0.3">#</text>
    <!-- Clean output drop -->
    <circle cx="0" cy="35" r="3" fill="#fb923c" opacity="0.6"/>
    <!-- Filter lines inside funnel -->
    <line x1="-18" y1="-18" x2="18" y2="-18" stroke="#fb923c" stroke-width="0.8" opacity="0.3"/>
    <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#fb923c" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Accent divider -->
  <line x1="155" y1="40" x2="155" y2="145" stroke="#fb923c" stroke-width="1" opacity="0.2"/>

  <!-- Title -->
  <text x="170" y="58" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#fb923c" filter="url(#glow)">ResponderSluiceBoxCleaner</text>

  <!-- Subtitle -->
  <text x="172" y="85" font-family="'Courier New', Courier, monospace" font-size="13" fill="#8b949e">Responder Hash Capture Deduplicator</text>

  <!-- Description -->
  <text x="172" y="110" font-family="'Courier New', Courier, monospace" font-size="11" fill="#484f58">Sift + dedup by user/type  ·  Archive originals  ·  Hashcat-ready output</text>

  <!-- Badges -->
  <g font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="700">
    <rect x="172" y="124" width="42" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="193" y="136" fill="#fb923c" text-anchor="middle">bash</text>
    <rect x="220" y="124" width="68" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="254" y="136" fill="#6b7280" text-anchor="middle">responder</text>
    <rect x="294" y="124" width="56" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="322" y="136" fill="#6b7280" text-anchor="middle">hashcat</text>
    <rect x="356" y="124" width="52" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="382" y="136" fill="#6b7280" text-anchor="middle">pentest</text>
  </g>

  <!-- Author -->
  <text x="172" y="166" font-family="'Courier New', Courier, monospace" font-size="11" fill="#484f58">SkyzFallin</text>
</svg>
